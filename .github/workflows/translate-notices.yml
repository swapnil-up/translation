name: Translate Notices (Backfill)

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: Notices to process per run
        default: '1'
        required: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  translate-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Cache PaddleOCR models
        uses: actions/cache@v4
        with:
          path: ~/.paddlex
          key: paddlex-${{ runner.os }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libgl1 libglib2.0-0
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Process one notice
        run: python scripts/process_notice.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add notices.json translations/
          git diff --quiet && git diff --staged --quiet || git commit -m "translate one notice"
          git push