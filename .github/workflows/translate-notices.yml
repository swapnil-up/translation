name: Translate Notices (Backfill)

on:
  schedule:
    - cron: '0 4 * * *'   # 4 AM — picks up where previous run stopped
    - cron: '0 16 * * *'  # 4 PM — catches quota window from earlier expiry
  workflow_dispatch:
    inputs:
      count:
        description: Notices to process per run (0 = unlimited, stops when Gemini quota exhausted)
        default: '0'
        required: false

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  translate-notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Cache PaddleOCR models
        uses: actions/cache@v4
        with:
          path: ~/.paddlex
          key: paddlex-${{ runner.os }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libgl1 libglib2.0-0
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Process notices until quota exhausted
        run: python scripts/process_notice.py --max-count ${{ github.event.inputs.count || '0' }}
      - name: Upsert to pgvector (if DATABASE_URL configured)
        if: ${{ secrets.DATABASE_URL != '' }}
        continue-on-error: true
        run: python scripts/upsert_notice.py translations/*.json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add notices.json translations/
          git diff --cached --quiet || (git commit -m "translate notices" && git push)